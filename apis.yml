name: WayPay
description: WayPay was a cloud-based B2B payments and accounts-payable-automation fintech headquartered
  in Burlington, Ontario, Canada. Its platform let businesses pay any supplier by any method (EFT, cheque,
  credit card, wire) from a single dashboard, reconciling against accounting and ERP software to automate
  the accounts-payable workflow. Royal Bank of Canada (RBC) announced its acquisition of WayPay in July 2019,
  after which the independent brand was retired. As of this enrichment pass the domain waypay.ca resolves via
  DNS (behind Akamai, enterprise mail) but serves no public site (HTTP 503), and there is no reachable public
  developer portal, API, or documentation surface.
